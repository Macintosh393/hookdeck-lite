# Workspace layout and version pins. Decisions: docs/adr/0001-monorepo.md, docs/adr/0017-toolchain-versions.md.
packages:
  - apps/*
  - packages/*
  - tools/*

# One place for every version. Workspaces refer to these with "catalog:".
# A major bump of anything here needs a new ADR (ADR-0017).
catalog:
  # Toolchain
  typescript: ~6.0.3
  turbo: ^2.11.0
  tsx: ^4.23.15
  prettier: ~3.9.10
  eslint: ^10.14.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.72.2
  '@types/node': ^24.19.2
  # Tests
  vitest: ^5.1.0
  '@vitest/coverage-v8': ^5.1.0
  vite: ^8.3.8
  standardwebhooks: ^1.1.1
  # Runtime libraries
  zod: ^4.6.7
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  bullmq: ^6.7.0
  ioredis: ^6.0.0
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  # The SSRF-safe HTTP client (docs/SECURITY.md#ssrf-protection).
  undici: ^8.12.4
  ipaddr.js: ^2.5.0
  # Prisma: the three packages are pinned to the same exact version.
  # Never install `prisma` without a version: `latest` is a Prisma 8 release candidate.
  prisma: 7.10.1
  '@prisma/client': 7.10.1
  '@prisma/adapter-pg': 7.10.1
  # NestJS
  '@nestjs/common': ^12.4.2
  '@nestjs/core': ^12.4.2
  '@nestjs/platform-fastify': ^12.4.2
  '@nestjs/testing': ^12.4.2
  '@nestjs/cli': ^12.0.12
  '@nestjs/schematics': ^12.0.13
  fastify: 5.12.8
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2

# pnpm 12 blocks dependency build scripts unless they are listed here (strictDepBuilds).
# true = run the package's install script, false = never run it.
allowBuilds:
  # Downloads the Prisma schema engine used by prisma migrate.
  '@prisma/engines': true
  prisma: true
  # Verifies the platform binary that tsx uses to run TypeScript.
  esbuild: true
  # Optional native speed-up for BullMQ's msgpack encoding. The pure-JS fallback is fine,
  # and skipping it avoids a native build step that differs between Windows and Linux.
  msgpackr-extract: false
